# VEY RAXIS SENTINEL - Training Configuration (Multi-Category 80 Classes)
project_name: "veyraxis-sentinel"
data: "data/dataset.yaml"

model:
  name: "yolo11n.pt"         # Base architecture weights
  num_classes: 80
  classes:
    - "person"
    - "bicycle"
    - "car"
    - "motorcycle"
    - "airplane"
    - "bus"
    - "train"
    - "truck"
    - "boat"
    - "traffic light"
    - "fire hydrant"
    - "stop sign"
    - "parking meter"
    - "bench"
    - "bird"
    - "cat"
    - "dog"
    - "horse"
    - "sheep"
    - "cow"
    - "elephant"
    - "bear"
    - "zebra"
    - "giraffe"
    - "backpack"
    - "umbrella"
    - "handbag"
    - "tie"
    - "suitcase"
    - "frisbee"
    - "skis"
    - "snowboard"
    - "sports ball"
    - "kite"
    - "baseball bat"
    - "baseball glove"
    - "skateboard"
    - "surfboard"
    - "tennis racket"
    - "bottle"
    - "wine glass"
    - "cup"
    - "fork"
    - "knife"
    - "spoon"
    - "bowl"
    - "banana"
    - "apple"
    - "sandwich"
    - "orange"
    - "broccoli"
    - "carrot"
    - "hot dog"
    - "pizza"
    - "donut"
    - "cake"
    - "chair"
    - "couch"
    - "potted plant"
    - "bed"
    - "dining table"
    - "toilet"
    - "tv"
    - "laptop"
    - "mouse"
    - "remote"
    - "keyboard"
    - "cell phone"
    - "microwave"
    - "oven"
    - "toaster"
    - "sink"
    - "refrigerator"
    - "book"
    - "clock"
    - "vase"
    - "scissors"
    - "teddy bear"
    - "hair drier"
    - "toothbrush"
  imgsz: 640
  device: "0"                # Target NVIDIA RTX 4050 GPU
  half: true                 # Automatic Mixed Precision (FP16) on GPU

training:
  epochs: 10
  batch_size: 16
  workers: 4
  optimizer: "AdamW"
  lr0: 0.001
  lrf: 0.01
  momentum: 0.937
  weight_decay: 0.0005
  warmup_epochs: 2.0
  patience: 15
  seed: 42
  save_period: 5
  pretrained: true

augmentation:
  hsv_h: 0.015
  hsv_s: 0.7
  hsv_v: 0.4
  degrees: 0.0
  translate: 0.1
  scale: 0.5
  fliplr: 0.5
  flipud: 0.0
  mosaic: 1.0
  mixup: 0.0

tracking:
  enabled: true
  tracking_uri: "sqlite:///mlflow.db"
  experiment_name: "veyraxis-sentinel"
