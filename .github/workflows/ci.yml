name: Veyraxis Sentinel CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglib2.0-0 ffmpeg

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .

      - name: Lint and Code Formatting (Ruff)
        run: |
          ruff check src tests scripts api
          ruff format --check src tests scripts api

      - name: Execute Pytest Suite
        run: |
          pytest -v

      - name: Validate Synthetic Dataset
        run: |
          python scripts/validate_dataset.py --data dataset/data.yaml --output-dir outputs/ci_dataset_reports
